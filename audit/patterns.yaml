# High-risk UI patterns as data. Read patterns.md for how to use this file.
# Each record is on consecutive lines, so `grep -A9 'id: P-pin-pad'` returns one pattern
# and `grep -B1 -A8 'tier: L1'` returns a tier.

channels:
  - id: input-value
    compare: "the value of a form field"
    find_in_sdk: "input and change listeners; value serialisation in the full snapshot; hooks on the value property setter"
  - id: value-length
    compare: "the length or magnitude of a masked value"
    find_in_sdk: "the mask functions for inputs and text"
  - id: emit-timing
    compare: "whether events fire only when a masked value changes"
    find_in_sdk: "deduplication, last-value caches, throttles on the input path"
  - id: key-count
    compare: "how many input, key or mutation events fire"
    find_in_sdk: "input and keyboard listeners; mutation batching"
  - id: key-timing
    compare: "gaps between events (keystroke dynamics)"
    find_in_sdk: "event timestamping; any batching or coarsening"
  - id: checked-state
    compare: "checked, selected and similar state"
    find_in_sdk: "input observer; snapshot handling of checkbox, radio and option"
  - id: select-state
    compare: "the chosen option of a select"
    find_in_sdk: "snapshot and input handling of select and option"
  - id: focus
    compare: "order and count of focus and blur events"
    find_in_sdk: "focus and blur listeners"
  - id: click-target
    compare: "node id and DOM position of clicked, touched or focused elements"
    find_in_sdk: "mouse interaction, touch and focus observers"
  - id: pointer-path
    compare: "coordinates and node ids in mouse and pointer moves, including over blocked and masked elements"
    find_in_sdk: "mouse move observer and its sampling"
  - id: touch-path
    compare: "coordinates in touch events"
    find_in_sdk: "touch move handling in the pointer observers"
  - id: hover-state
    compare: "class, style and attribute changes caused by hover, active or focus"
    find_in_sdk: "attribute mutation recording"
  - id: attribute
    compare: "attribute values: aria-*, data-*, class, style, type, title, alt, href, src"
    find_in_sdk: "attribute serialisation in the snapshot and in attribute mutations"
  - id: text
    compare: "text content and its changes, including masked text"
    find_in_sdk: "text node serialisation; character data and child list mutations"
  - id: title-meta
    compare: "document title, favicon, meta tags"
    find_in_sdk: "meta event; head serialisation; title mutations"
  - id: url
    compare: "page URL, history URLs, link and frame URLs"
    find_in_sdk: "meta and navigation events; URL attribute handling"
  - id: stylesheet
    compare: "CSS text, rules and inline styles"
    find_in_sdk: "stylesheet inlining and rule observers"
  - id: canvas
    compare: "canvas draw calls and pixels"
    find_in_sdk: "canvas recording"
  - id: image
    compare: "image src, srcset, data and blob URLs, inlined pixels"
    find_in_sdk: "image inlining; src attribute handling"
  - id: iframe
    compare: "content and URLs of iframes"
    find_in_sdk: "iframe recording and cross-origin handling"
  - id: shadow-dom
    compare: "content inside shadow roots"
    find_in_sdk: "shadow DOM recording and the mask ancestor walk"
  - id: network
    compare: "request and response URLs, headers and bodies"
    find_in_sdk: "network capture plugin"
  - id: clipboard
    compare: "copy and paste payloads"
    find_in_sdk: "clipboard listeners"
  - id: selection
    compare: "selection ranges and caret position"
    find_in_sdk: "selection observer"
  - id: scroll
    compare: "scroll positions inside masked or blocked containers"
    find_in_sdk: "scroll observer"
  - id: viewport
    compare: "viewport size changes"
    find_in_sdk: "viewport resize observer"
  - id: layout-size
    compare: "element dimensions that track hidden content"
    find_in_sdk: "block placeholders; masked text replacement"

pages:
  - id: shell
    holds: "Public baseline present on every page: navigation, headings, styles, fonts, images, hover menus, a public link next to each private widget."
  - id: login
    holds: "Sign-in, sign-up and verification."
  - id: profile-form
    holds: "Profile and onboarding form with every input type."
  - id: checkout
    holds: "Cart and payment."
  - id: account
    holds: "Logged-in account overview."
  - id: questionnaire
    holds: "Health and consent questionnaire built from native and custom controls."
  - id: search-and-compose
    holds: "Search, messaging and location input."
  - id: back-office
    holds: "Support agent and admin views of other people's data."
  - id: secure-entry
    holds: "Pointer and touch secret entry."
  - id: components
    holds: "Web components with open and closed shadow roots."

patterns:
  - id: P-public-text
    rank: 1
    tier: L1
    category: public
    special_category: false
    page: shell
    channels: [text, layout-size]
    what: "Navigation, headings, labels, help text, marketing copy, product names and prices"
    where: "every page"
    test: "Must survive under targeted: exact text and layout"
  - id: P-public-style
    rank: 2
    tier: L1
    category: public
    special_category: false
    page: shell
    channels: [stylesheet]
    what: "External and inline stylesheets, CSS-in-JS, custom properties, web fonts, animations and transitions"
    where: "every page"
    test: "Must survive under targeted: styles, fonts and animation states"
  - id: P-public-media
    rank: 3
    tier: L1
    category: public
    special_category: false
    page: shell
    channels: [image, canvas]
    what: "Logos, product images, icons, icon fonts, SVG illustrations, background images"
    where: "every page"
    test: "Must survive under targeted: images and SVG as shown"
  - id: P-public-interaction
    rank: 4
    tier: L1
    category: public
    special_category: false
    page: shell
    channels: [hover-state, click-target, scroll]
    what: "Hover menus, accordions of public FAQ, tabs, carousels, scrolling, and the results of a catalogue search (the query the person types is personal)"
    where: "every page with menus, tabs, carousels or scrolling"
    test: "Must survive under targeted: every interaction and the state it produces"
  - id: P-pii-text
    rank: 5
    tier: L1
    category: personal
    special_category: false
    page: account
    channels: [text, title-meta, attribute]
    what: "Names, emails, addresses, account numbers rendered as page text"
    where: "any logged-in page: the account name or email in the header, profile and order pages"
    test: "Account page with personal details as plain text. Under the default config, record whether any of it is masked."
  - id: P-input-types
    rank: 6
    tier: L1
    category: personal
    special_category: false
    page: profile-form
    channels: [input-value, value-length, emit-timing]
    what: "One field of every input type: `text`, `password`, `email`, `tel`, `number`, `range`, `date`, `time`, `datetime-local`, `month`, `week`, `color`, `search`, `url`, `hidden`, `file`, plus `textarea`, `select` and `contenteditable`"
    where: "every form: sign-up, checkout, contact, settings"
    test: "Fill each with two values of different length (for `number`: `42` and `125000`). Record the masked output per type and per config in a table in `coverage`."
  - id: P-password
    rank: 7
    tier: L1
    category: secret
    special_category: false
    page: login
    channels: [value-length, key-count, key-timing, emit-timing]
    what: "Password field"
    where: "every site with a login"
    test: "`input type=password`. Type `abc` and `correct horse battery`."
  - id: P-validation
    rank: 8
    tier: L1
    category: personal
    special_category: false
    page: login
    channels: [text, attribute, key-timing]
    what: "Inline validation and error messages (\"must contain a digit\", \"email already registered\", \"card declined\")"
    where: "nearly every form library validates inline"
    test: "Field with live and on-submit validation."
  - id: P-checkbox-radio
    rank: 9
    tier: L1
    category: personal
    special_category: true
    page: questionnaire
    channels: [checked-state, focus]
    what: "Native checkboxes and radios"
    where: "terms and marketing consent, settings, questionnaires"
    test: "Health questionnaire with yes/no radios."
  - id: P-custom-toggle
    rank: 10
    tier: L1
    category: personal
    special_category: false
    page: questionnaire
    channels: [attribute, click-target]
    what: "Switches, toggles and segmented controls built from divs"
    where: "cookie consent banners and settings pages built from design-system switches"
    test: "Div switch that flips class `on`."
  - id: P-password-reveal
    rank: 11
    tier: L1
    category: secret
    special_category: false
    page: login
    channels: [attribute, input-value]
    what: "Show/hide toggle that switches `type=\"password\"` to `type=\"text\"`"
